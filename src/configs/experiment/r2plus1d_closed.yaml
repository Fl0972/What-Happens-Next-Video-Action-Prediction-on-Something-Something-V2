# @package _global_
# Track 1 (Closed World) — R(2+1)D-18 trained from scratch.
#
# Same training recipe as ``tsm_closed`` (cosine + warmup, label smoothing,
# MixUp/CutMix, RandAugment) but a different inductive bias: full 3D conv
# factored into spatial + temporal halves, instead of TSM's parameter-free
# channel shifts on top of a 2D backbone.
defaults:
  - override /model: r2plus1d

dataset:
  num_frames: 8
  image_size: 112

model:
  pretrained: false
  dropout: 0.5

training:
  epochs: 15
  batch_size: 8
  lr: 0.001
  optimizer: adamw
  weight_decay: 0.0005
  scheduler: cosine
  warmup_epochs: 5
  label_smoothing: 0.1
  mixup_alpha: 0.4
  cutmix_prob: 0.5
  rand_augment_ops: 2
  rand_augment_magnitude: 0.5
  checkpoint_path: ${hydra:runtime.cwd}/../models/r2plus1d_closed.pt

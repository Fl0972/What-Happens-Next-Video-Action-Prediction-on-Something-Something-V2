# @package _global_
# CoAtNet-RMLP-1 — hybrid MBConv+Transformer, from scratch, rotating folds (closed track).
#
# Architecture:
#   CoAtNet-RMLP-1 (timm, ~42M params, random init). pretrained=false.
#   C-C-T-T layout: two MBConv stages then two Transformer stages.
#   Per-frame features, temporal mean-pool, linear classifier.
#
# Why rotating folds: same rationale as efficientformer_scratch_rotating.
#
# LR: 1e-4 (lower than EfficientFormer) because CoAtNet's two Transformer stages
#   are more sensitive to large gradient steps at random initialisation.
#
# Resume: training.resume=true means train_kfold.py will automatically reload the
#   last-epoch checkpoint if it exists and continue from where it left off.
#
# Run: cd src && python train_kfold.py experiment=coatnet_scratch_rotating

defaults:
  - override /model: trackA_coatnet

dataset:
  num_frames: 4
  image_size: 224

model:
  pretrained: false
  variant: "coatnet_rmlp_1_rw2_224.sw_in12k_ft_in1k"
  head_dropout: 0.3

training:
  epochs: 125
  batch_size: 16
  lr: 0.0001
  optimizer: adamw
  weight_decay: 0.1
  backbone_lr_scale: 1.0
  scheduler: cosine_warm_restarts
  sgdr_t0: 25
  sgdr_t_mult: 1
  warmup_epochs: 10
  reg_warmup_epochs: 10
  label_smoothing: 0.2
  mixup_alpha: 0.4
  cutmix_prob: 0.5
  clip_grad_norm: 1.0
  rand_augment_ops: 2
  rand_augment_magnitude: 0.5
  horizontal_flip: false
  weighted_sampling: true
  sampler_power: 0.5
  num_workers: 8
  rotating_folds: true
  n_folds: 5
  resume: true
  checkpoint_path: ${hydra:runtime.cwd}/../models/coatnet_scratch.pt

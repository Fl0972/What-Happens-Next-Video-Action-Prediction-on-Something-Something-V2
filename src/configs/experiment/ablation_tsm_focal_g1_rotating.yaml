# @package _global_
# ABLATION C — TSM with focal loss γ=1 (rotating folds).
#
# Question: Is γ=2 the optimal focal strength for TSM on SSv2-33, or does
# a softer γ=1 perform better by down-weighting hard examples less aggressively?
#
# Background: Lin et al. (RetinaNet, 2017) chose γ=2 as the standard value
# for object detection. On SSv2, the hard-example distribution differs:
#   * Hard pairs are *semantically* near-identical (real vs. pretend), not
#     just visually similar at different scales.
#   * Each class has ~1,364 training examples on average; with small class
#     sizes, γ=2 may suppress useful gradients from ambiguous-but-correct
#     samples rather than only from easy ones.
# γ=1 provides softer down-weighting: (1-p)^1 vs (1-p)^2 means correct
# predictions at p=0.8 receive 0.2× gradient (γ=1) vs 0.04× (γ=2).
#
# Setup: identical to tsm_ultra_v2_rotating in every respect except:
#
#   focal_gamma: 2.0  →  1.0
#
# All other knobs frozen: T=4, fold_div=4, R18, AdamW lr=1e-3, SGDR T0=25,
# 200 epochs, rotating 5-fold, label_smoothing=0.1, RandAug, MixUp, CutMix,
# weighted_sampling, drop_path=0.1, dropout=0.3.
#
# Expected outcome:
#   If γ=2 is optimal → this run lands below T3 (39.45%).
#   If γ=1 outperforms → γ=2 was over-suppressing gradient from hard-but-
#   learnable pairs; optimal γ is in [1, 2].
#   Together with T3 and Exp A, this gives three points on the γ axis:
#     Exp A (γ=0) < ? < Exp C (γ=1) vs T3 (γ=2) — sufficient to see the trend.
#
# Failure resilience:
#   resume: true  — restores from models/ablation_tsm_focal_g1_last.pt
#   wandb: run_id persisted in last checkpoint; re-attaches automatically.
#
# Wall-clock: ~4 min/epoch × 200 epochs ≈ 13h on A4000 at 150 W.
# Run (Machine 3):
#   cd src && python train_kfold.py experiment=ablation_tsm_focal_g1_rotating

defaults:
  - override /model: tsm_resnet

dataset:
  num_frames: 4
  image_size: 224

model:
  pretrained: false
  backbone: resnet18
  fold_div: 4
  drop_path_rate: 0.1
  dropout: 0.3

training:
  epochs: 200
  batch_size: 32
  lr: 0.001
  optimizer: adamw
  weight_decay: 0.0005
  scheduler: cosine_warm_restarts
  sgdr_t0: 25
  sgdr_t_mult: 1
  warmup_epochs: 8
  reg_warmup_epochs: 10
  label_smoothing: 0.1
  focal_gamma: 1.0    # ablated: 2.0 → 1.0
  mixup_alpha: 0.2
  cutmix_prob: 0.25
  rand_augment_ops: 2
  rand_augment_magnitude: 0.5
  horizontal_flip: false
  weighted_sampling: true
  sampler_power: 0.5
  compile: true
  compile_mode: default
  rotating_folds: true
  n_folds: 5
  resume: true
  wandb_project: "challenge-modal"
  wandb_run_name: "ablation-C-tsm-focal-g1"
  checkpoint_path: ${hydra:runtime.cwd}/../models/ablation_tsm_focal_g1.pt

# @package _global_
# ViT-B/16 + BiGRU + temporal attention pooling — from-scratch closed-track recipe.
#
# Key differences from vit_bigru_attn (pretrained fine-tuning):
#
#   1. pretrained: false — random backbone initialisation.
#
#   2. backbone_lr_scale removed — uniform LR across all layers.
#      LLRD (backbone_lr_scale=0.05) is a fine-tuning trick; with a randomly-
#      initialised backbone it starves the backbone of gradient signal and causes
#      stuck-at-~3% failure (same issue observed in tsm_resnet50_bigru_scratch).
#
#   3. epochs: 150, warmup: 15 — ViT needs far more passes to converge from scratch.
#
#   4. weight_decay: 0.1, feat_dropout: 0.3, head_dropout: 0.5 — stronger
#      regularisation; ViT-B/16 has 86M parameters on a small dataset.
#
#   5. cosine_warm_restarts (sgdr_t0=30) — periodic LR resets help escape shallow
#      local minima that a pretrained model never encounters.
#
#   6. Stronger augmentation (mixup 0.4, cutmix 0.5, label_smoothing 0.2,
#      rand_augment_magnitude 0.7) — matches the from-scratch budget used in
#      efficientformer_scratch_rotating.
#
#   7. rotating_folds: true — closed-track policy: no pretrained weights.
#
# Run: cd src && python train_kfold.py experiment=vit_bigru_attn_scratch

defaults:
  - override /model: vit_bigru_attn

dataset:
  num_frames: 4
  image_size: 224

model:
  pretrained: false
  gru_hidden: 256
  gru_layers: 1
  feat_dropout: 0.3
  head_dropout: 0.5

training:
  epochs: 150
  batch_size: 16
  lr: 0.001
  optimizer: adamw
  weight_decay: 0.1
  scheduler: cosine_warm_restarts
  sgdr_t0: 30
  sgdr_t_mult: 1
  warmup_epochs: 15
  reg_warmup_epochs: 15
  label_smoothing: 0.2
  mixup_alpha: 0.4
  cutmix_prob: 0.5
  clip_grad_norm: 1.0
  rand_augment_ops: 2
  rand_augment_magnitude: 0.7
  horizontal_flip: false
  weighted_sampling: true
  sampler_power: 0.5
  rotating_folds: true
  n_folds: 5
  resume: true
  checkpoint_path: ${hydra:runtime.cwd}/../models/vit_bigru_attn_scratch.pt

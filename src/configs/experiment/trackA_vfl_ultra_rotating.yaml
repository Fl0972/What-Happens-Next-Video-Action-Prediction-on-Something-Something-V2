                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  # @package _global_
# VideoFormer-Lite ULTRA — rotating folds variant.
#
# Motivation: video_former_lite_ultra reached 53.37% internal val / 32.11% on
# the true val set. The original YAML comments described several planned
# improvements (n_layers 2->3, lr 5e-4->8e-4) that were never applied to the
# deployed config. This run applies all of them alongside rotating folds.
#
# Changes vs video_former_lite_ultra (and why):
#
#   * rotating_folds true (new)
#       Same argument as tsm_ultra_v2_rotating: 100% data utilisation,
#       unbiased rolling-average checkpoint. Saves to
#       models/video_former_lite_ultra_rotating.pt.
#
#   * n_layers 2 -> 3
#       The original VFL_ultra YAML planned this change but never applied it.
#       With 4 frame tokens + [CLS] = 5 tokens, a third encoder block gives
#       the attention more depth to compose global temporal relations.
#       Rotating folds supplies enough training signal for the deeper model
#       without increasing overfitting risk (all data is seen every 5 epochs).
#       Cost: ~+0.8 M params; runtime: ~+8% per epoch.
#
#   * focal_gamma 2.0 (new)
#       The confusion analysis (FINAL_MODEL.md §5.4) shows VFL suffers from
#       the same hard near-miss pairs as TSM (real↔pretend, fold↔unfold).
#       Focal loss downweights easy examples and concentrates gradient on these
#       hard pairs. tsm_ultra_v2 gained +4.4 pp from focal loss; even a
#       fraction of that gain on VFL improves the ensemble.
#
#   * lr 5e-4 -> 8e-4
#       Planned-but-not-applied from VFL_ultra comments. Higher peak LR
#       shortens time-to-good-loss on a cosine/SGDR schedule. Safe with
#       warmup_epochs=12 (see below).
#
#   * warmup_epochs 8 -> 12
#       Longer linear warmup to stabilise the deeper (3-layer) Transformer
#       before the full lr_0=8e-4 is reached. Non-optional when raising lr.
#
#   * drop_path_rate 0.15 -> 0.20
#       Slightly more stochastic depth to match the deeper network and the
#       longer training (150 vs 100 epochs gives more opportunities to overfit).
#
#   * epochs 100 -> 150
#       150 = 5 × 30 complete fold rotations, giving ~120 "effective epochs"
#       over the full training set — well above the original 100 with fixed
#       split. VFL_ultra was still improving at epoch 100 (val_acc ~0.53);
#       30 extra effective epochs should push further.
#
#   * scheduler cosine -> cosine_warm_restarts (T_0=25, T_mult=1)
#       Same reasoning as TSM rotating: prevents LR decay to near-zero before
#       the full data has been covered. 6 restarts over 150 epochs.
#
#   * compile true (new)
#       ~20-30% throughput improvement.
#
# Unchanged (proven — do not touch):
#   d_model=512, n_heads=8, mlp_ratio=4.0, attn_dropout=0.0, proj_dropout=0.0,
#   dropout=0.2, weight_decay=0.05, label_smoothing=0.1, mixup_alpha=0.2,
#   cutmix_prob=0.25, RandAug(2, 0.5), horizontal_flip=false,
#   weighted_sampling=true, sampler_power=0.5, reg_warmup_epochs=10,
#   num_frames=4 (clip length is exactly 4 frames; using >4 duplicates frames
#   which adds no information and corrupts temporal position embeddings).
#
# Wall-clock estimate: ~5 min/epoch × 150 epochs ≈ 12.5h on a single A4000.
# Run: cd src && python train_kfold.py experiment=vfl_ultra_rotating

defaults:
  - override /model: trackA_video_former_lite

dataset:
  num_frames: 4
  image_size: 224

model:
  pretrained: false
  d_model: 512
  n_heads: 8
  n_layers: 3
  mlp_ratio: 4.0
  attn_dropout: 0.0
  proj_dropout: 0.0
  drop_path_rate: 0.20
  dropout: 0.2

training:
  epochs: 150
  batch_size: 32
  lr: 0.0008
  optimizer: adamw
  weight_decay: 0.05
  scheduler: cosine_warm_restarts
  sgdr_t0: 25
  sgdr_t_mult: 1
  warmup_epochs: 12
  reg_warmup_epochs: 10
  label_smoothing: 0.1
  focal_gamma: 2.0
  mixup_alpha: 0.2
  cutmix_prob: 0.25
  rand_augment_ops: 2
  rand_augment_magnitude: 0.5
  horizontal_flip: false
  weighted_sampling: true
  sampler_power: 0.5
  compile: true
  compile_mode: default
  rotating_folds: true
  n_folds: 5
  checkpoint_path: ${hydra:runtime.cwd}/../models/video_former_lite_ultra.pt

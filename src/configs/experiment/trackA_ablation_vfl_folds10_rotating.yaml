# @package _global_
# ABLATION D — VFL with 10-fold rotating validation (data ceiling test).
#
# Question: Has VFL-Ultra-Rotating saturated its data-utilisation capacity at
# n_folds=5 (80% per epoch), or does exposing it to 90% per epoch via n_folds=10
# yield further gains consistent with the data-hunger hypothesis (§4.3)?
#
# Setup: identical to vfl_ultra_rotating in every respect except:
#
#   n_folds: 5   →  10
#   sgdr_t0: 25  →  50
#       SGDR T0 scales with n_folds: the original rationale was "5 fold-
#       rotations per LR cycle", i.e. T0 = 5 × n_folds. With n_folds=10,
#       T0=50 preserves the same structure: one LR restart every 5 complete
#       fold-rotations. 150 epochs / 50 = 3 full SGDR cycles (vs. 6 for V3),
#       which is sufficient to cover the training budget without excessive
#       restarts on a longer warmup period.
#   epochs: 150  (unchanged)
#       At n_folds=10, 150 epochs = 15 complete fold-rotations and ~135
#       effective epochs over the full dataset (vs. 30 rotations / 120
#       effective epochs for V3). The wall-clock remains identical since
#       epoch count and per-epoch cost are the same.
#
# All other knobs frozen: T=4, n_layers=3, d_model=512, n_heads=8,
# focal_gamma=2.0, AdamW lr=8e-4, warmup=12 ep, reg_warmup=10 ep,
# drop_path=0.20, dropout=0.2, RandAug, MixUp, CutMix, label_smoothing=0.1,
# weighted_sampling.
#
# Expected outcome:
#   If VFL is data-limited at n_folds=5 → this run will clearly exceed
#   V3 (36.44%), potentially +1–3 pp.
#   If VFL has saturated → this run will match V3 within noise (~±0.3 pp).
#   A null or negative result is equally informative: it bounds where to
#   invest future compute (more folds vs. deeper models vs. better augmentation).
#
# Practical note on checkpointing: the rolling-average window expands from
# 5 to 10 epochs. The first best-checkpoint save therefore requires completing
# at least 10 epochs (one full fold-rotation) rather than 5.
#
# Failure resilience:
#   resume: true  — restores from models/ablation_vfl_folds10_last.pt,
#   including rolling_window (list of last 10 val accs) and no_improve_count.
#   wandb: run_id persisted in last checkpoint; re-attaches automatically.
#
# Wall-clock: ~5 min/epoch × 150 epochs ≈ 12.5h on A4000 at 150 W.
# Run (Machine 4):
#   cd src && python train_kfold.py experiment=ablation_vfl_folds10_rotating

defaults:
  - override /model: trackA_video_former_lite

dataset:
  num_frames: 4
  image_size: 224

model:
  pretrained: false
  d_model: 512
  n_heads: 8
  n_layers: 3
  mlp_ratio: 4.0
  attn_dropout: 0.0
  proj_dropout: 0.0
  drop_path_rate: 0.20
  dropout: 0.2

training:
  epochs: 150
  batch_size: 32
  lr: 0.0008
  optimizer: adamw
  weight_decay: 0.05
  scheduler: cosine_warm_restarts
  sgdr_t0: 50          # ablated: 25 → 50 (= 5 fold-rotations per LR cycle at n_folds=10)
  sgdr_t_mult: 1
  warmup_epochs: 12
  reg_warmup_epochs: 10
  label_smoothing: 0.1
  focal_gamma: 2.0
  mixup_alpha: 0.2
  cutmix_prob: 0.25
  rand_augment_ops: 2
  rand_augment_magnitude: 0.5
  horizontal_flip: false
  weighted_sampling: true
  sampler_power: 0.5
  compile: true
  compile_mode: default
  rotating_folds: true
  n_folds: 10           # ablated: 5 → 10 (90% train per epoch vs 80%)
  resume: true
  wandb_project: "challenge-modal"
  wandb_run_name: "ablation-D-vfl-folds10"
  checkpoint_path: ${hydra:runtime.cwd}/../models/ablation_vfl_folds10.pt

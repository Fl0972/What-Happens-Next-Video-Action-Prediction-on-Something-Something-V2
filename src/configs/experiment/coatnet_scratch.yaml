# @package _global_
# CoAtNet-RMLP-1 — hybrid MBConv+Transformer trained from scratch (closed track).
#
# Architecture:
#   CoAtNet-RMLP-1 (timm: coatnet_rmlp_1_rw2_224.sw_in12k_ft_in1k, ~42M params,
#   random init). C-C-T-T layout — two MBConv stages then two Transformer stages.
#   Per-frame features, temporal mean-pool, linear classifier.
#   pretrained=false: no external weights are loaded; architecture only.
#
# From-scratch recipe: same recipe as EfficientFormer scratch but with a slightly
# lower LR (1e-4) because CoAtNet's deeper transformer stages are more sensitive
# to large gradient steps at initialisation.

defaults:
  - override /model: coatnet

dataset:
  num_frames: 4
  image_size: 224

model:
  pretrained: false
  variant: "coatnet_rmlp_1_rw2_224.sw_in12k_ft_in1k"
  head_dropout: 0.3

training:
  epochs: 100
  batch_size: 16
  lr: 0.0001
  optimizer: adamw
  weight_decay: 0.1
  backbone_lr_scale: 1.0
  scheduler: cosine
  warmup_epochs: 10
  reg_warmup_epochs: 10
  label_smoothing: 0.2
  mixup_alpha: 0.4
  cutmix_prob: 0.5
  clip_grad_norm: 1.0
  rand_augment_ops: 2
  rand_augment_magnitude: 0.5
  horizontal_flip: false
  weighted_sampling: true
  sampler_power: 0.5
  num_workers: 8
  checkpoint_path: ${hydra:runtime.cwd}/../models/coatnet_scratch.pt

# @package _global_
# TSM_ultra_v2 — rotating folds variant.
#
# Motivation: tsm_ultra_v2 achieves 57.73% internal val / 38.25% on the true
# val set with a fixed 80/20 split inside train_dir. Rotating folds trains the
# same single model but rotates the held-out fold every epoch, so:
#   (a) every training sample is seen by the model across all epochs (100% data
#       utilisation vs 80% in the fixed split);
#   (b) the model cannot overfit a single held-out slice — validation signal is
#       measured over ALL data via the rolling-average checkpoint;
#   (c) error estimation is unbiased: best checkpoint is the one with the
#       highest rolling-average val acc across one complete fold rotation (5
#       consecutive epochs).
#
# Changes vs tsm_ultra_v2 (and why):
#
#   * rotating_folds true (new)
#       Enables Mode 2 of train_kfold.py: epoch e uses fold (e % 5) as val,
#       the remaining 4 as train. Saves to models/tsm_ultra_v2_rotating.pt.
#
#   * epochs 150 -> 200
#       200 = 5 × 40 complete fold rotations. Each epoch only trains on 80% of
#       data; 200 epochs gives ~160 "effective epochs" over the full set,
#       matching (and slightly exceeding) the original 150-epoch fixed-split run.
#
#   * scheduler cosine -> cosine_warm_restarts (T_0=25, T_mult=1)
#       Single cosine decays to ~0 by epoch 150. With rotating folds the
#       training distribution changes every epoch; periodic LR restarts (every
#       25 epochs = 5 complete rotations) let the model escape sharp minima
#       specific to one data subset and re-explore with a fresh LR.
#       8 restarts over 200 epochs (after warmup) provide broad coverage.
#
#   * compile true (new)
#       torch.compile gives ~20-30% throughput improvement at no accuracy cost.
#       train_kfold.py compiles once after model init; the pre-built fold
#       DataLoaders avoid any re-tracing overhead between epochs.
#
# Unchanged from tsm_ultra_v2 (all proven — do not touch):
#   focal_gamma=2.0, fold_div=4, num_frames=4, label_smoothing=0.1,
#   mixup_alpha=0.2, cutmix_prob=0.25, RandAug(2, 0.5), horizontal_flip=false,
#   weighted_sampling=true, sampler_power=0.5, reg_warmup_epochs=10.
#
# Wall-clock estimate: ~3.5 min/epoch × 200 epochs ≈ 11.7h on a single A4000.
# Run: cd src && python train_kfold.py experiment=tsm_ultra_v2_rotating

defaults:
  - override /model: tsm_resnet

dataset:
  num_frames: 4
  image_size: 224

model:
  pretrained: false
  backbone: resnet18
  fold_div: 4
  drop_path_rate: 0.1
  dropout: 0.3

training:
  epochs: 200
  batch_size: 32
  lr: 0.001
  optimizer: adamw
  weight_decay: 0.0005
  scheduler: cosine_warm_restarts
  sgdr_t0: 25
  sgdr_t_mult: 1
  warmup_epochs: 8
  reg_warmup_epochs: 10
  label_smoothing: 0.1
  focal_gamma: 2.0
  mixup_alpha: 0.2
  cutmix_prob: 0.25
  rand_augment_ops: 2
  rand_augment_magnitude: 0.5
  horizontal_flip: false
  weighted_sampling: true
  sampler_power: 0.5
  compile: true
  compile_mode: default
  rotating_folds: true
  n_folds: 5
  checkpoint_path: ${hydra:runtime.cwd}/../models/tsm_ultra_v2.pt

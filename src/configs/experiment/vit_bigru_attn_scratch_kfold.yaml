# @package _global_
# ViT-B/16 + BiGRU + temporal attention pooling — from-scratch, MODE 1 k-fold.
#
# Same from-scratch recipe as vit_bigru_attn_scratch, but for TRUE k-fold:
# 4 independent models (one per fold) trained in parallel on 4 machines, then
# ensembled. Differs from the rotating-folds variant only in:
#
#   rotating_folds: false   — Mode 1 (separate model per fold), not Mode 2.
#   n_folds: 4              — 4-way stratified split; each model trains on 75%,
#                             validates on its own disjoint 25%. Collectively
#                             every sample is held out by exactly one model.
#
# IMPORTANT — all 4 machines MUST use identical n_folds=4 and the same
# dataset.seed so the stratified split is consistent; only fold_idx differs.
#
# Per-machine launch (machine K runs fold K, K in 0..3):
#   cd src && timeout 9h python train_kfold.py \
#       experiment=vit_bigru_attn_scratch_kfold training.fold_idx=K
#
# epochs=150 is an upper bound, not a target: each run is wall-clock-capped at
# 9h (timeout) and the best-val checkpoint is saved continuously, so an early
# kill keeps the best model. sgdr_t0=30 means the LR reaches a clean minimum
# every 30 epochs (~9h at ~16 min/epoch on a free 3090), so the cut-off tends
# to land near a low-LR, well-settled point.
#
# After all 4 finish, collect vit_bigru_attn_scratch_kfold_fold_{0..3}.pt onto
# one machine and ensemble (see create_ensemble_submission.py).

defaults:
  - override /model: vit_bigru_attn

dataset:
  num_frames: 4
  image_size: 224

model:
  pretrained: false
  gru_hidden: 256
  gru_layers: 1
  feat_dropout: 0.3
  head_dropout: 0.5

training:
  epochs: 150
  batch_size: 16
  lr: 0.001
  optimizer: adamw
  weight_decay: 0.1
  scheduler: cosine_warm_restarts
  sgdr_t0: 30
  sgdr_t_mult: 1
  warmup_epochs: 15
  reg_warmup_epochs: 15
  label_smoothing: 0.2
  mixup_alpha: 0.4
  cutmix_prob: 0.5
  clip_grad_norm: 1.0
  rand_augment_ops: 2
  rand_augment_magnitude: 0.7
  horizontal_flip: false
  weighted_sampling: true
  sampler_power: 0.5
  rotating_folds: false
  n_folds: 4
  resume: true
  checkpoint_path: ${hydra:runtime.cwd}/../models/vit_bigru_attn_scratch_kfold.pt

# @package _global_
training:
  batch_size: 8
  lr: 0.0001        # initial/base LR (used as min_lr by OneCycleLR)
  max_lr: 0.001     # peak LR for cosine schedule with warmup
  weight_decay: 0.05
  epochs: 25
  num_workers: 2
  # Where to save the best checkpoint (by validation accuracy)
  checkpoint_path: ${hydra:runtime.cwd}/../models/videomae_3_top3_top1.pt
  device: cuda
  mixup_alpha: 0.4         # Beta distribution parameter; 0.0 disables MixUp
  cutmix_prob: 0.5         # Probability of using CutMix instead of MixUp per batch
  label_smoothing: 0.1     # CrossEntropyLoss label smoothing
  amp: true                # Mixed-precision (autocast) on CUDA — also used at inference
  amp_dtype: bfloat16      # 'bfloat16' (Ada/Ampere) or 'float16'
  eval_view_chunk: 4       # Inference: views processed per forward pass (caps GPU mem)
  class_weight_temperature: 0.10   # ensemble_per_class.py: T in softmax(acc/T) over models
  softmax_cache_dir: null          # default = <models_dir>/_softmax_cache
  # ensemble_gradient.py: learned (gradient-descent) weighted soft-vote
  grad_weight_mode: global   # 'global' (M weights, safe) or 'per_class' (M×C, expressive)
  grad_steps: 300            # Adam steps to fit ensemble weights
  grad_lr: 0.05              # Adam LR for ensemble-weight fitting
  grad_l2_uniform: 0.001     # L2 pull of weights toward uniform (regularizer)
  grad_holdout_frac: 0.0     # >0 → fit on a val subset, report honest held-out acc, then refit on all
  ema_decay: 0.999         # EMA of weights; set to 0.0 to disable
  top_k_checkpoints: 3     # Save top-K checkpoints by val acc (snapshot ensemble)
  ensemble_top_k: 3        # At inference, ensemble this many top-K snapshots
  # Explicit list of checkpoints to ensemble (overrides ensemble_top_k when set).
  # Example: training.checkpoint_paths=[/abs/a.pt,/abs/b.pt]
  checkpoint_paths: null
  init_weights_from: null  # warm-start model weights from this checkpoint (staged finetuning); fresh optimizer/schedule
  skip_submission: false   # ensemble_per_class.py: skip CSV write (val-only run)
